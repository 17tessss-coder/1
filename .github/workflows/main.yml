name: Build VST3 Windows x64

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Setup MSVC Toolchain
      uses: ilammy/msvc-dev-cmd@v1

    - name: Unpack Source Code
      shell: powershell
      run: |
        $zipFile = Get-ChildItem -Filter "*.zip" | Select-Object -First 1
        if ($zipFile) {
            Write-Host "Распаковка архива: $($zipFile.Name)"
            Expand-Archive -Path $zipFile.FullName -DestinationPath . -Force
            # Перемещаем файлы наружу, если они запакованы во вложенную папку
            $subDirs = Get-ChildItem -Directory
            if ($subDirs.Count -eq 1) {
                Move-Item -Path "$($subDirs.FullName)\*" -Destination . -Force
            }
        } else {
            Write-Error "ZIP архив не найден в репозитории!"
            exit 1
        }

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

    - name: Build Plugin
      run: cmake --build build --config Release

    - name: Archive VST3 Artifacts
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path .\Artifacts
        Get-ChildItem -Path .\build -Filter "*.vst3" -Recurse | Copy-Item -Destination .\Artifacts -Recurse
        Compress-Archive -Path .\Artifacts\* -DestinationPath .\vst3_plugin_windows_x64.zip

    - name: Upload VST3 Zip
      uses: actions/upload-artifact@v4
      with:
        name: vst3-plugin-windows-x64
        path: vst3_plugin_windows_x64.zip
