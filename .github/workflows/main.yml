name: Build VST3 Windows x64

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Setup MSVC Toolchain
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    - name: Unpack Source Code
      shell: powershell
      run: |
        $zipFile = Get-ChildItem -Filter "*.zip" | Select-Object -First 1
        if ($zipFile) {
            Write-Host "Unpacking archive: $($zipFile.Name)"
            Expand-Archive -Path $zipFile.FullName -DestinationPath .\unpacked_source -Force
        } else {
            Write-Error "ZIP archive not found!"
            exit 1
        }

    - name: Configure CMake
      shell: powershell
      run: |
        $cmakeFile = Get-ChildItem -Path .\unpacked_source -Filter "CMakeLists.txt" -Recurse | Select-Object -First 1
        if (-not $cmakeFile) {
            Write-Error "CMakeLists.txt not found inside ZIP archive!"
            exit 1
        }
        $sourceDir = $cmakeFile.Directory.FullName
        Write-Host "Found project directory: $sourceDir"
        
        # Используем генератор Ninja вместо Visual Studio, чтобы избежать ошибки инстанса VS
        cmake -S "$sourceDir" -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build Plugin
      run: cmake --build build --config Release

    - name: Archive VST3 Artifacts
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path .\Artifacts
        $vst3Items = Get-ChildItem -Path .\build -Filter "*.vst3" -Recurse
        if (-not $vst3Items) {
            Write-Host "Direct .vst3 files not found, searching directories..."
            $vst3Items = Get-ChildItem -Path .\build -Directory -Filter "*.vst3" -Recurse
        }
        foreach ($item in $vst3Items) {
            Copy-Item -Path $item.FullName -Destination .\Artifacts -Recurse -Force
        }
        Compress-Archive -Path .\Artifacts\* -DestinationPath .\vst3_plugin_windows_x64.zip

    - name: Upload VST3 Zip
      uses: actions/upload-artifact@v4
      with:
        name: vst3-plugin-windows-x64
        path: vst3_plugin_windows_x64.zip
